name: Daily Static Election Environment Sync
on:
  schedule:
    - cron: '0 0 * * *' # 每日台灣時間 08:00 自動執行
  workflow_dispatch:    # 支援在 GitHub Actions 頁面手動一鍵觸發

permissions:
  contents: write

jobs:
  update-static-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update data.json (Locked Model Mode)
        run: python update_daily.py

      - name: Commit and push updated data.json
        run: |
          git config user.name "ElectionEnvBot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git commit -m "chore: daily locked environment sync" || exit 0
          git push
